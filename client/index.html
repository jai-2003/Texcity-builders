    <!-- Start downloading the current page's hero image right away instead of waiting for the
         page's code to load and discover it (Services and Contact). Files: public/heroes. -->
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, '');
        var phone = matchMedia('(max-width: 760px)').matches;
        var h = '/heroes/';
        // Phones: the same fixed file the page's <picture> uses. Larger screens: the same srcset
        // and sizes as the <img>, so the browser picks exactly the file the page will request.
        var hero = {
          '/services': phone ? { href: h + 'services-hero-bg-sm.webp' } : {
            srcset: h + 'services-hero-bg-sm.webp 800w, ' + h + 'services-hero-bg.webp 1641w', sizes: '100vw' },
          '/contact': phone ? { href: h + 'contact-banner-mobile.webp' } : {
            srcset: h + 'contact-banner-md.webp 1240w, ' + h + 'contact-banner.webp 2065w', sizes: '(max-width: 1290px) 100vw, 1290px' },
        }[path];
        if (!hero) return;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        if (hero.href) link.href = hero.href;
        else { link.setAttribute('imagesrcset', hero.srcset); link.setAttribute('imagesizes', hero.sizes); }
        link.setAttribute('fetchpriority', 'high');
        document.head.appendChild(link);
      })();
    </script>
